<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#109965"><title>激活 · 私人政治题库</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f4f7f5;color:#1d2521;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{width:min(100%,400px);background:#fff;padding:32px;border:1px solid #e2e9e5;border-radius:24px;box-shadow:0 16px 40px #1833220b}.icon{width:48px;height:48px;border-radius:15px;background:#eaf7f0;color:#08764b;display:grid;place-items:center;font-size:25px}h1{font-size:26px;margin:20px 0 10px}p{color:#6e7872;line-height:1.7;font-size:14px}label{font-size:14px;font-weight:700;display:block;margin-top:28px}input{width:100%;font:inherit;font-size:24px;letter-spacing:6px;border:1px solid #cfdcd4;border-radius:12px;padding:14px;margin:9px 0 16px;outline-color:#109965}button{width:100%;padding:14px;border:0;border-radius:12px;color:white;background:#109965;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#status{color:#b33636;font-size:13px;min-height:24px}small{display:block;color:#89958e;font-size:12px;line-height:1.7;margin-top:16px}</style></head><body><main><div class="icon">题</div><h1>私人政治题库</h1><p>输入激活码，进入自己的刷题与 AI 学习空间。</p><form id="login"><label for="code">激活码</label><input id="code" name="code" type="password" inputmode="numeric" autocomplete="current-password" maxlength="64" required autofocus><button id="submit" type="submit">激活并进入</button><p id="status" role="status"></p></form><small>激活后在这台设备保持登录 7 天。API 密钥请在进入后的“模型设置”中填写。</small></main><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),s=document.getElementById('status');b.disabled=true;s.textContent='正在验证…';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'验证失败');location.replace('/');}catch(error){s.textContent=error.message==='Failed to fetch'?'连接失败，请稍后重试。':error.message;}finally{b.disabled=false;}});</script></body></html>
